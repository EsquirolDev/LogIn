<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>

        <h1>Crear una cuenta</h1>

        <form action="login.html" method="post">
            <label for="name" id="name">Nombre</label>
            <input type="text" id="name" placeholder="Escribe tu nombre">
        
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="tu@correo.com">

            <label for="passIni" id="passIni">Contraseña</label>
            <input type="password" name="passIni" id="passIni" placeholder="Escribe tu contraseña">

            <button type="submit" id="submitButton">Iniciar sesión</button>
        </form>

        <a href="register.html">Crea una cuenta en su lugar</a>

    </main>
</body>
</html>
